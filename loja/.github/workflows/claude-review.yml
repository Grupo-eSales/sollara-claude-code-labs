name: Revisão com Claude
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  revisao:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revise este PR contra CLAUDE.md e .claude/rules/.
            Reporte apenas bugs e violações de regra que você confirmou no diff, com arquivo e linha.
            Não comente estilo que o linter já cobre. Se não houver achados, diga isso em uma linha.
          claude_args: '--max-turns 15 --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"'
